[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-benchmark"
version = "0.1.0"
description = "Reproducible comparison of joint speech models and diarization pipelines"
requires-python = ">=3.11"
dependencies = [
  "meeteval>=0.4.3,<0.5", "pyannote.metrics>=4,<5",
  "soundfile>=0.13,<0.15", "scipy>=1.11,<2", "psutil>=7,<8",
]

[project.scripts]
speaker-bench = "speaker_benchmark.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
