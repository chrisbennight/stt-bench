name: Verify benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the locked CPU environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked
      - name: Check code and publication files
        run: |
          uv run ruff check src scripts tests
          uv run pytest -q
          uv run python scripts/check_publication.py
      - name: Recompute every original and corrected score
        run: |
          uv run python scripts/verify_scores.py results/ami-4090-2026-09-27/original --output /tmp/verification-original.json
          uv run python scripts/verify_scores.py results/ami-4090-2026-09-27/corrected --output /tmp/verification-corrected.json
